<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>gtracker</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f232c;
    --border: #2a2f3a;
    --text: #e8eaed;
    --text-dim: #9aa0ac;
    --accent: #d4a537;
    --accent-2: #4a90e2;
    --win: #3ecf8e;
    --loss: #ef5b5b;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 80px; }
  header.app-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
  }
  header.app-header h1 {
    font-size: 22px; margin: 0; letter-spacing: 0.5px;
  }
  header.app-header h1 span { color: var(--accent); }
  #userBar { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-dim); }
  #userBar button {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 12px;
  }
  #userBar button:hover { color: var(--text); border-color: var(--text-dim); }

  /* Auth screen */
  #authScreen {
    max-width: 360px; margin: 60px auto; background: var(--panel);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 28px;
  }
  #authScreen h2 { margin-top: 0; font-size: 20px; }
  #authScreen p.sub { color: var(--text-dim); font-size: 13px; margin-top: -8px; margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 12px; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; font-size: 14px; font-family: inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent-2); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 11px 14px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 14px; font-weight: 600; margin-top: 4px;
  }
  .btn-primary { background: var(--accent); color: #1a1400; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-google {
    background: #fff; color: #222;
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .divider { display: flex; align-items: center; gap: 10px; margin: 18px 0; color: var(--text-dim); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  #authError { color: var(--loss); font-size: 13px; margin-top: 10px; min-height: 16px; }
  #authToggle { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-dim); }
  #authToggle a { color: var(--accent-2); cursor: pointer; text-decoration: none; }

  /* App */
  #appScreen { display: none; }
  .stats-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px;
  }
  .stat-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 10px; text-align: center;
  }
  .stat-card .val { font-size: 18px; font-weight: 700; }
  .stat-card .lbl { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .win-val { color: var(--win); } .loss-val { color: var(--loss); }

  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; margin-bottom: 24px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 16px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }

  .session-list { display: flex; flex-direction: column; gap: 10px; }
  .session-item {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px;
  }
  .session-item .meta { font-size: 13px; }
  .session-item .meta .top { font-weight: 600; }
  .session-item .meta .bottom { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .session-item .amt { font-weight: 700; font-size: 15px; white-space: nowrap; margin-left: 10px; }
  .session-item .del {
    background: transparent; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 16px; margin-left: 10px; padding: 4px 8px;
  }
  .session-item .del:hover { color: var(--loss); }
  .empty-state { color: var(--text-dim); font-size: 13px; text-align: center; padding: 20px 0; }
  #addError { color: var(--loss); font-size: 13px; margin-top: 4px; min-height: 16px; }

  @media (max-width: 480px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="app-header">
    <h1>g<span>tracker</span></h1>
    <div id="userBar"></div>
  </header>

  <!-- AUTH SCREEN -->
  <div id="authScreen">
    <h2 id="authTitle">Sign in</h2>
    <p class="sub">Track your poker &amp; gambling sessions.</p>

    <button class="btn btn-google" id="googleBtn">
      <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-2.1 14.1-5.5l-6.5-5.5C29.6 34.7 27 35.5 24 35.5c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-0.8 2.3-2.3 4.3-4.2 5.7l6.5 5.5C41.8 36.2 44 30.6 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or</div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="emailInput" autocomplete="email" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="passwordInput" autocomplete="current-password" />
    </div>
    <button class="btn btn-primary" id="emailAuthBtn">Sign in</button>
    <div id="authError"></div>
    <div id="authToggle"><span id="authToggleText">Don't have an account? </span><a id="authToggleLink">Sign up</a></div>
  </div>

  <!-- APP SCREEN -->
  <div id="appScreen">
    <div class="stats-grid">
      <div class="stat-card"><div class="val" id="statSessions">0</div><div class="lbl">Sessions</div></div>
      <div class="stat-card"><div class="val" id="statNet">$0</div><div class="lbl">Net</div></div>
      <div class="stat-card"><div class="val" id="statAvg">$0</div><div class="lbl">Avg / Session</div></div>
      <div class="stat-card"><div class="val" id="statWinRate">0%</div><div class="lbl">Win Rate</div></div>
    </div>

    <div class="panel">
      <h2>Log a session</h2>
      <div class="row">
        <div class="field">
          <label>Date</label>
          <input type="date" id="dateInput" />
        </div>
        <div class="field">
          <label>Game type</label>
          <select id="gameTypeInput">
            <option>Cash Game</option>
            <option>Tournament</option>
            <option>Sports Betting</option>
            <option>Other</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Location</label>
        <input type="text" id="locationInput" placeholder="e.g. Commerce Casino, home game" />
      </div>
      <div class="row">
        <div class="field">
          <label>Buy-in ($)</label>
          <input type="number" id="buyInInput" step="0.01" placeholder="0.00" />
        </div>
        <div class="field">
          <label>Cash-out ($)</label>
          <input type="number" id="cashOutInput" step="0.01" placeholder="0.00" />
        </div>
        <div class="field">
          <label>Duration (min, optional)</label>
          <input type="number" id="durationInput" placeholder="e.g. 180" />
        </div>
      </div>
      <div class="field">
        <label>Notes (optional)</label>
        <textarea id="notesInput" rows="2" placeholder="Any notes about the session"></textarea>
      </div>
      <button class="btn btn-primary" id="addSessionBtn">Add session</button>
      <div id="addError"></div>
    </div>

    <div class="panel">
      <h2>History</h2>
      <div class="session-list" id="sessionList">
        <div class="empty-state">No sessions yet — log your first one above.</div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    GoogleAuthProvider, signInWithPopup, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, deleteDoc, doc, query, where, onSnapshot,
    serverTimestamp, orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0go8kz3Nbkv7wwBlZCh67iWHEWj8aPGE",
    authDomain: "gtracker-60774.firebaseapp.com",
    projectId: "gtracker-60774",
    storageBucket: "gtracker-60774.firebasestorage.app",
    messagingSenderId: "366504781967",
    appId: "1:366504781967:web:0cb9e1c5f133f49df1e8fa"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const googleProvider = new GoogleAuthProvider();

  // ---- Elements ----
  const authScreen = document.getElementById('authScreen');
  const appScreen = document.getElementById('appScreen');
  const userBar = document.getElementById('userBar');
  const authTitle = document.getElementById('authTitle');
  const authToggleText = document.getElementById('authToggleText');
  const authToggleLink = document.getElementById('authToggleLink');
  const authError = document.getElementById('authError');
  const emailInput = document.getElementById('emailInput');
  const passwordInput = document.getElementById('passwordInput');
  const emailAuthBtn = document.getElementById('emailAuthBtn');
  const googleBtn = document.getElementById('googleBtn');

  const dateInput = document.getElementById('dateInput');
  const gameTypeInput = document.getElementById('gameTypeInput');
  const locationInput = document.getElementById('locationInput');
  const buyInInput = document.getElementById('buyInInput');
  const cashOutInput = document.getElementById('cashOutInput');
  const durationInput = document.getElementById('durationInput');
  const notesInput = document.getElementById('notesInput');
  const addSessionBtn = document.getElementById('addSessionBtn');
  const addError = document.getElementById('addError');
  const sessionList = document.getElementById('sessionList');

  const statSessions = document.getElementById('statSessions');
  const statNet = document.getElementById('statNet');
  const statAvg = document.getElementById('statAvg');
  const statWinRate = document.getElementById('statWinRate');

  let isSignUpMode = false;
  let unsubscribeSessions = null;

  // default date to today
  dateInput.valueAsDate = new Date();

  // ---- Auth mode toggle ----
  authToggleLink.addEventListener('click', () => {
    isSignUpMode = !isSignUpMode;
    authTitle.textContent = isSignUpMode ? 'Create an account' : 'Sign in';
    emailAuthBtn.textContent = isSignUpMode ? 'Sign up' : 'Sign in';
    authToggleText.textContent = isSignUpMode ? 'Already have an account? ' : "Don't have an account? ";
    authToggleLink.textContent = isSignUpMode ? 'Sign in' : 'Sign up';
    authError.textContent = '';
  });

  emailAuthBtn.addEventListener('click', async () => {
    authError.textContent = '';
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) {
      authError.textContent = 'Enter an email and password.';
      return;
    }
    try {
      if (isSignUpMode) {
        await createUserWithEmailAndPassword(auth, email, password);
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
    } catch (err) {
      authError.textContent = friendlyAuthError(err);
    }
  });

  googleBtn.addEventListener('click', async () => {
    authError.textContent = '';
    try {
      await signInWithPopup(auth, googleProvider);
    } catch (err) {
      authError.textContent = friendlyAuthError(err);
    }
  });

  function friendlyAuthError(err) {
    const code = err.code || '';
    if (code.includes('wrong-password') || code.includes('invalid-credential')) return 'Incorrect email or password.';
    if (code.includes('user-not-found')) return 'No account with that email.';
    if (code.includes('email-already-in-use')) return 'An account already exists with that email.';
    if (code.includes('weak-password')) return 'Password should be at least 6 characters.';
    if (code.includes('invalid-email')) return 'That email address looks invalid.';
    return 'Something went wrong. Please try again.';
  }

  // ---- Auth state ----
  onAuthStateChanged(auth, (user) => {
    if (user) {
      authScreen.style.display = 'none';
      appScreen.style.display = 'block';
      const name = user.displayName || user.email;
      userBar.innerHTML = `<span>${name}</span><button id="signOutBtn">Sign out</button>`;
      document.getElementById('signOutBtn').addEventListener('click', () => signOut(auth));
      subscribeToSessions(user.uid);
    } else {
      authScreen.style.display = 'block';
      appScreen.style.display = 'none';
      userBar.innerHTML = '';
      if (unsubscribeSessions) { unsubscribeSessions(); unsubscribeSessions = null; }
    }
  });

  // ---- Add session ----
  addSessionBtn.addEventListener('click', async () => {
    addError.textContent = '';
    const user = auth.currentUser;
    if (!user) return;

    const buyIn = parseFloat(buyInInput.value);
    const cashOut = parseFloat(cashOutInput.value);
    const dateVal = dateInput.value;
    const location = locationInput.value.trim();

    if (!dateVal) { addError.textContent = 'Pick a date.'; return; }
    if (isNaN(buyIn) || isNaN(cashOut)) { addError.textContent = 'Enter numeric buy-in and cash-out.'; return; }

    const durationRaw = durationInput.value;
    const duration = durationRaw ? parseInt(durationRaw, 10) : null;

    try {
      addSessionBtn.disabled = true;
      addSessionBtn.textContent = 'Adding…';
      await addDoc(collection(db, 'sessions'), {
        userId: user.uid,
        date: dateVal,
        gameType: gameTypeInput.value,
        location: location || null,
        buyIn: buyIn,
        cashOut: cashOut,
        durationMinutes: duration,
        notes: notesInput.value.trim() || null,
        createdAt: serverTimestamp()
      });
      buyInInput.value = '';
      cashOutInput.value = '';
      durationInput.value = '';
      locationInput.value = '';
      notesInput.value = '';
      dateInput.valueAsDate = new Date();
    } catch (err) {
      addError.textContent = 'Could not save session. Try again.';
      console.error(err);
    } finally {
      addSessionBtn.disabled = false;
      addSessionBtn.textContent = 'Add session';
    }
  });

  // ---- Live session list + stats ----
  function subscribeToSessions(uid) {
    if (unsubscribeSessions) unsubscribeSessions();
    const q = query(collection(db, 'sessions'), where('userId', '==', uid), orderBy('date', 'desc'));
    unsubscribeSessions = onSnapshot(q, (snap) => {
      const sessions = [];
      snap.forEach(d => sessions.push({ id: d.id, ...d.data() }));
      renderSessions(sessions);
      renderStats(sessions);
    }, (err) => {
      console.error(err);
    });
  }

  function fmtMoney(n) {
    const sign = n < 0 ? '-' : '';
    return `${sign}$${Math.abs(n).toFixed(2)}`;
  }

  function renderStats(sessions) {
    const count = sessions.length;
    const net = sessions.reduce((sum, s) => sum + (s.cashOut - s.buyIn), 0);
    const avg = count ? net / count : 0;
    const wins = sessions.filter(s => (s.cashOut - s.buyIn) > 0).length;
    const winRate = count ? Math.round((wins / count) * 100) : 0;

    statSessions.textContent = count;
    statNet.textContent = fmtMoney(net);
    statNet.className = 'val ' + (net > 0 ? 'win-val' : net < 0 ? 'loss-val' : '');
    statAvg.textContent = fmtMoney(avg);
    statAvg.className = 'val ' + (avg > 0 ? 'win-val' : avg < 0 ? 'loss-val' : '');
    statWinRate.textContent = winRate + '%';
  }

  function renderSessions(sessions) {
    if (!sessions.length) {
      sessionList.innerHTML = '<div class="empty-state">No sessions yet — log your first one above.</div>';
      return;
    }
    sessionList.innerHTML = '';
    for (const s of sessions) {
      const net = s.cashOut - s.buyIn;
      const item = document.createElement('div');
      item.className = 'session-item';
      const dateDisplay = new Date(s.date + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      const durText = s.durationMinutes ? ` · ${s.durationMinutes}m` : '';
      const locText = s.location ? ` · ${s.location}` : '';
      item.innerHTML = `
        <div class="meta">
          <div class="top">${s.gameType}${locText}</div>
          <div class="bottom">${dateDisplay}${durText}</div>
        </div>
        <div class="amt ${net > 0 ? 'win-val' : net < 0 ? 'loss-val' : ''}">${fmtMoney(net)}</div>
        <button class="del" title="Delete" data-id="${s.id}">✕</button>
      `;
      item.querySelector('.del').addEventListener('click', async (e) => {
        const id = e.currentTarget.getAttribute('data-id');
        try {
          await deleteDoc(doc(db, 'sessions', id));
        } catch (err) {
          console.error(err);
        }
      });
      sessionList.appendChild(item);
    }
  }
</script>
</body>
</html>
